name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        # Integration tests self-skip unless PROXY_COMMANDER_RUN_INTEGRATION_TESTS=1, so this
        # runs only the device-free unit tests in CI.
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IntelliJ Plugin and project configuration verifiers
        run: ./gradlew verifyPlugin verifyPluginProjectConfiguration verifyPluginStructure --no-parallel

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
