name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(./gradlew properties -q --console=plain | awk '$1 == "version:" { print $2; exit }')"
          if [[ -z "$project_version" ]]; then
            echo "Could not determine the Gradle project version." >&2
            exit 1
          fi
          expected_tag="v${project_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match Gradle project version '$project_version' (expected '$expected_tag')." >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin compatibility and project configuration
        run: ./gradlew verifyPlugin verifyPluginProjectConfiguration verifyPluginStructure --no-parallel

      - name: Prepare signing certificate file
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          set -euo pipefail
          certificate_file="$RUNNER_TEMP/proxycommander-certificate-chain.pem"
          if [[ "$CERTIFICATE_CHAIN" == *"BEGIN CERTIFICATE"* ]]; then
            printf '%s' "$CERTIFICATE_CHAIN" > "$certificate_file"
          else
            printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode > "$certificate_file"
          fi
          chmod 600 "$certificate_file"
          echo "CERTIFICATE_CHAIN_FILE=$certificate_file" >> "$GITHUB_ENV"

      - name: Sign plugin
        run: ./gradlew verifyPluginSignature
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*-signed.zip
          generate_release_notes: true
